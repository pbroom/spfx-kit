name: Evidence governance

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: evidence-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-history:
    name: Verify append-only evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .github/evidence-trust/v1/node-version

      - name: Mark candidate history validation pending
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/evidence-trust/v1/publish-status.mjs pending

      - name: Install trusted validator dependencies
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(node --version)" == v22.22.3 ]]
          [[ "$(npm --version)" == 10.9.8 ]]
          npm ci --ignore-scripts --prefix .github/evidence-trust/v1

      - name: Fetch candidate as inert Git data
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          candidate_ref=refs/remotes/origin/evidence-candidate
          git fetch --no-tags --no-recurse-submodules --depth=1 origin \
            "+refs/pull/${PR_NUMBER}/head:${candidate_ref}"
          actual_sha="$(git rev-parse --verify "${candidate_ref}^{commit}")"
          [[ "$actual_sha" == "$EXPECTED_HEAD_SHA" ]]

      - name: Validate candidate with trusted base code
        id: validate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_REQUIRE_ISOLATED_RUNTIME: '1'
          EVIDENCE_TRUST_NPM_VERSION: '10.9.8'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          node .github/evidence-trust/v1/validate-shadcn-evidence.mjs \
            --base-ref "$BASE_SHA" \
            --candidate-ref "$CANDIDATE_SHA"

      - name: Publish candidate-head history status
        if: ${{ always() }}
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: node .github/evidence-trust/v1/publish-status.mjs terminal
